[build.environment]
  # NEXT_PUBLIC_* values are inlined into the browser bundle by Next.js by design,
  # and the Cloudinary cloud name is part of every public image URL. These are
  # stored as secret env vars, so tell secrets scanning not to flag them.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_NAME,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,CLOUDINARY_CLOUD_NAME"
